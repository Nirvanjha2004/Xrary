[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hiring-agent"
version = "0.1.0"
description = "Automated SDE intern hiring signal agent for X with WhatsApp alerts"
requires-python = ">=3.11"
dependencies = [
	"apscheduler>=3.10.4",
	"httpx>=0.27.0",
	"langgraph>=0.2.0",
	"openai>=1.40.0",
	"pydantic>=2.8.0",
	"pydantic-settings>=2.4.0",
	"sqlalchemy>=2.0.0",
	"structlog>=24.1.0",
	"tenacity>=8.2.3",
	"twilio>=9.2.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
