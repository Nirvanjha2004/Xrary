version: "3.8"

services:
  hiring-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hiring-agent
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    environment:
      - SQLITE_DB_PATH=/app/data/hiring_agent.db
      - LOG_LEVEL=INFO
    networks:
      - hiring-agent-network

